name: CI — Tests e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.ref }}
  # On ne annule pas les runs sur main pour ne pas interrompre un gate de déploiement
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cookthatone
          POSTGRES_PASSWORD: cookthatone
          POSTGRES_DB: cookthatone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cookthatone:cookthatone@localhost:5432/cookthatone?schema=public
      # Redis est mocké dans les tests e2e ; une URL factice suffit
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Tests e2e
        run: npm run test:e2e
